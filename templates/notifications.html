{% extends "base.html" %}
{% block content %}
    <h2>Notifications</h2>
    {% if notes %}
        <div>
        {% for n in notes %}
            <div class="req-row">
                <span>{{ n.message }}</span>
                <span class="muted" style="font-size:13px">{{ n.created_at.strftime("%Y-%m-%d %H:%M") }}</span>
            </div>
        {% endfor %}
        </div>
    {% else %}
        <p class="muted">No notifications yet.</p>
    {% endif %}
{% endblock %}
