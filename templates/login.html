{% extends "base.html" %}
{% block content %}
    <h2>Log in</h2>
    {% if error %}<p style="color:#c1443a">{{ error }}</p>{% endif %}
    <form method="post">
        <p><label>Email <span class="req">*</span><br><input type="email" name="email" required></label></p>
        <p><label>Password <span class="req">*</span><br><input type="password" name="password" required></label></p>
        <p><label><input type="checkbox" name="remember"> Remember me</label></p>
        <p><button type="submit">Log in</button></p>
    </form>
    <p>No account yet? <a href="{{ url_for('register') }}">Register</a></p>
    <p><a href="{{ url_for('forgot_password') }}">Forgot password?</a></p>
{% endblock %}
