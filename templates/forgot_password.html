{% extends "base.html" %}
{% block content %}
    <h2>Forgot password</h2>
    {% if error %}<p style="color:#c1443a">{{ error }}</p>{% endif %}
    <p class="muted" style="font-size:13px">Enter your BTH email and we'll send you a reset code.</p>
    <form method="post" action="{{ url_for('forgot_password') }}">
        <p><label>Email <span class="req">*</span><br><input type="email" name="email" required></label></p>
        <p><button type="submit">Send code</button></p>
    </form>
{% endblock %}
