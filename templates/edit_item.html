{% extends "base.html" %}
{% block content %}
    <h2>Edit item</h2>
    {% if error %}<p style="color:#c1443a">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('edit_item', item_id=item.id) }}">
        <p><label>Title <span class="req">*</span><br><input type="text" name="title" value="{{ item.title }}" required></label></p>
        <p><label>Category<br><input type="text" name="category" value="{{ item.category or '' }}"></label></p>
        <p><label>Description<br><textarea name="description">{{ item.description or '' }}</textarea></label></p>
        <p><label><span class="lbl">Available from</span><input type="date" name="available_from" value="{{ item.available_from.strftime('%Y-%m-%d') if item.available_from else '' }}"></label></p>
        <p><label><span class="lbl">Available until</span><input type="date" name="available_until" value="{{ item.available_until.strftime('%Y-%m-%d') if item.available_until else '' }}"></label></p>
        <label style="display:flex;align-items:center;gap:8px;font-weight:600">
            <input type="checkbox" name="is_giveaway" style="width:auto" {% if item.is_giveaway %}checked{% endif %}> This is a giveaway (no return needed)
        </label>
        <p><button type="submit">Save changes</button></p>
    </form>
{% endblock %}
