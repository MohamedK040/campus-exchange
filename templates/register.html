{% extends "base.html" %}
{% block content %}
    <h2>Register</h2>
    {% if error %}<p style="color:#c1443a">{{ error }}</p>{% endif %}
    <p class="muted" style="font-size:13px">Fields marked <span class="req">*</span> are required.</p>
    <form method="post">
        <p><label>First name <span class="req">*</span><br><input type="text" name="first_name" required></label></p>
        <p><label>Last name <span class="req">*</span><br><input type="text" name="last_name" required></label></p>
        <p><label>BTH email <span class="req">*</span><br><input type="email" name="email" required></label></p>
        <p><label>Password <span class="req">*</span><br><input type="password" name="password" required></label></p>
        <p><label>Confirm password <span class="req">*</span><br><input type="password" name="confirm_password" required></label></p>
        <p><button type="submit">Create account</button></p>
    </form>
    <p>Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
{% endblock %}
