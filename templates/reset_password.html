{% extends "base.html" %}
{% block content %}
    <h2>Reset password</h2>
    {% if error %}<p style="color:#c1443a">{{ error }}</p>{% endif %}
    <p class="muted" style="font-size:13px">We sent a code to {{ email }}. Enter it below with your new password.</p>
    <form method="post" action="{{ url_for('reset_password') }}">
        <p><label>Reset code <span class="req">*</span><br><input type="text" name="code" required></label></p>
        <p><label>New password <span class="req">*</span><br><input type="password" name="password" required></label></p>
        <p><label>Confirm new password <span class="req">*</span><br><input type="password" name="confirm_password" required></label></p>
        <p><button type="submit">Reset password</button></p>
    </form>
{% endblock %}
