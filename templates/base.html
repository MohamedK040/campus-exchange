<!doctype html>
<html lang="sv">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Campus Exchange</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="site">
        <div class="bar">
            <a class="brand" href="{{ url_for('home') }}"><span class="logo-mark">&#9829;</span> Campus Exchange</a>
            <nav>
                {% if current_user.is_authenticated %}
                <a class="nav-add" href="{{ url_for('new_item') }}">+ Add item</a>
                <a href="{{ url_for('my_items') }}">My items</a>
                <a href="{{ url_for('notifications') }}">Notifications</a>
                <a href="{{ url_for('my_loans') }}">My loans</a>
                <span class="who">{{ current_user.name }}</span>
                <a href="{{ url_for('logout') }}">Log out</a>
                {% else %}
                <a href="{{ url_for('login') }}">Log in</a>
                <a href="{{ url_for('register') }}">Register</a>
                {% endif %}
            </nav>
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
