<!doctype html>
<html lang="sv">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Campus Exchange</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{
        --bg:#f5f8f7; --surface:#ffffff; --ink:#10231e; --muted:#5f6f6a;
        --line:#e4ebe8; --accent:#0e2b7c; --accent-dark:#173a99; --accent-soft:#eaf0ff; --gold:#e3a008;
        }
        *{box-sizing:border-box}
        body{margin:0;background:var(--bg);color:var(--ink);
        font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
        a{color:var(--accent);text-decoration:none}
        a:hover{text-decoration:underline}

        header.site{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.94);
        backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
        .bar{width:min(1120px,calc(100% - 48px));margin:0 auto;min-height:72px;display:flex;
        align-items:center;justify-content:space-between;gap:16px}
        .brand{display:inline-flex;align-items:center;gap:10px;font-size:18px;font-weight:800;
        color:var(--accent);letter-spacing:-.025em}
        .brand:hover{text-decoration:none}
        .logo-mark{display:grid;width:34px;height:34px;place-items:center;border-radius:10px;
        background:var(--accent);color:#fff;font-size:17px}
        nav{display:flex;align-items:center;gap:22px;font-size:14px;flex-wrap:wrap}
        nav a{color:#43534e;font-weight:600}
        nav a:hover{color:var(--accent);text-decoration:none}
        nav .nav-add{padding:9px 15px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
        nav .who{color:var(--muted);font-weight:500}

        main{width:min(1120px,calc(100% - 48px));margin:0 auto;padding:28px 0 72px}
        main>form{max-width:480px}
        h1{font-size:40px;line-height:1.08;letter-spacing:-.03em;margin:0 0 16px}
        h2{font-size:26px;letter-spacing:-.02em;margin:0 0 16px}
        h3{font-size:16px;margin:22px 0 10px}

        button,.btn{display:inline-block;background:var(--accent);color:#fff;border:none;border-radius:10px;
        padding:11px 18px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;
        transition:background .15s,transform .15s}
        button:hover,.btn:hover{background:var(--accent-dark);text-decoration:none;transform:translateY(-1px)}
        .btn.small{padding:6px 12px;font-size:13px;border-radius:8px}
        button.ghost,.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
        button.ghost:hover,.btn.ghost:hover{background:var(--accent-soft)}

        input,textarea,select{width:100%;padding:11px 12px;border:1px solid #dbe4e1;border-radius:9px;
        font-size:14px;font-family:inherit;background:#fbfcfc}
        input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);
        box-shadow:0 0 0 3px rgba(14,43,124,.09)}
        label{display:block;font-size:13px;font-weight:600;margin-bottom:14px}
        label .lbl{display:block;margin-bottom:4px;color:var(--muted)}
        .req{color:#c1443a}

        .search-box{display:flex;gap:10px;width:min(680px,100%);margin:0 auto}
        .search-box input{flex:1;height:56px;border-radius:12px;font-size:15px;
        box-shadow:0 12px 34px rgba(20,48,39,.08)}
        .search-box button{height:56px;border-radius:12px;padding:0 22px}

        .hero{text-align:center;padding:60px 16px 20px;
        background:radial-gradient(circle at 15% 25%,rgba(202,228,218,.4),transparent 30%),
        radial-gradient(circle at 85% 50%,rgba(213,222,247,.5),transparent 30%);
        border-radius:20px;margin-bottom:12px}
        .hero h1{font-size:clamp(34px,5vw,56px);line-height:1.05;letter-spacing:-.04em;margin:0}
        .hero h1 span{color:var(--accent)}
        .eyebrow{margin:0 0 12px;color:var(--accent);font-size:12px;font-weight:800;
        letter-spacing:.12em;text-transform:uppercase}
        .hero-copy{margin:16px auto 28px;color:var(--muted);font-size:17px;max-width:520px}

        .section-heading{display:flex;align-items:baseline;justify-content:space-between;margin:36px 0 18px}
        .section-heading h2{margin:0}

        .cards{list-style:none;margin:0;padding:0;display:grid;gap:22px;
        grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
        .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;
        transition:box-shadow .18s,transform .18s}
        .card:hover{box-shadow:0 14px 34px rgba(20,48,39,.09);transform:translateY(-3px)}
        .card h3{margin:0 0 6px;font-size:17px}
        .card p{margin:6px 0 0;color:var(--muted);font-size:14px}

        .item-card{padding:0;overflow:hidden}
        .card-image{position:relative;display:block;width:100%;height:200px;background:#e9eeec;overflow:hidden}
        .card-image img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease}
        .item-card:hover .card-image img{transform:scale(1.04)}
        .card-body{padding:18px}
        .card-body h3{margin:0 0 8px;font-size:18px;letter-spacing:-.02em}
        .card-body h3 a{color:var(--ink)}
        .card-body p{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.55}
        .listed{margin:0;padding-top:12px;border-top:1px solid var(--line);
        color:#7c8a86;font-size:12px;font-weight:600}

        .cat,.category{display:inline-block;background:var(--accent-soft);color:var(--accent);
        font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;margin-bottom:6px}
        .card-image .category{position:absolute;left:12px;bottom:12px;margin:0;border:2px solid rgba(255,255,255,.75)}
        .tone-blue{background:#e1e9ff;color:#284886}
        .tone-green{background:#e4f2df;color:#446e35}

        .badge{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;text-transform:capitalize}
        .badge.pending{background:#fff4d6;color:#8a5b00}
        .badge.accepted{background:#dff5e9;color:#176945}
        .badge.rejected{background:#ffe7e5;color:#9e3732}
        .badge.returned{background:#e9edeb;color:#56645f}

        .stars{color:var(--gold);font-weight:700}

        .empty{color:var(--muted);background:var(--surface);border:1px dashed var(--line);
        border-radius:16px;padding:48px 24px;text-align:center}
        .muted{color:var(--muted)}
        .req-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
        .req-row:last-child{border-bottom:none}
        .req-row form{display:inline;margin:0}

        @media (max-width:600px){
            .bar{width:calc(100% - 32px);min-height:60px;gap:12px}
            nav{gap:14px;font-size:13px}
            main{width:calc(100% - 32px);padding:20px 0 48px}
            .hero{padding:40px 14px 14px}
            .cards{grid-template-columns:1fr}
        }
    </style>
</head>
<body>
    <header class="site">
        <div class="bar">
            <a class="brand" href="{{ url_for('home') }}"><span class="logo-mark">&#9829;</span> Campus Exchange</a>
            <nav>
                {% if current_user.is_authenticated %}
                <a class="nav-add" href="{{ url_for('new_item') }}">+ Add item</a>
                <a href="{{ url_for('my_items') }}">My items</a>
                <a href="{{ url_for('notifications') }}">Notifications</a>
                <a href="{{ url_for('my_loans') }}">My loans</a>
                <span class="who">{{ current_user.name }}</span>
                <a href="{{ url_for('logout') }}">Log out</a>
                {% else %}
                <a href="{{ url_for('login') }}">Log in</a>
                <a href="{{ url_for('register') }}">Register</a>
                {% endif %}
            </nav>
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
